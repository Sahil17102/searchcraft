services:
  - type: web
    name: searchcraft-client
    runtime: static
    buildCommand: echo "SearchCraft static site ready"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
